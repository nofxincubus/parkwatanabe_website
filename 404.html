<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Park Watanabe LLC</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #090b10;
            color: #cbd5e1;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-white/[0.03] border border-white/10 rounded-3xl p-8 sm:p-10 backdrop-blur-xl">
        <div class="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="compass" class="w-8 h-8"></i>
        </div>
        
        <h1 class="text-4xl font-extrabold text-white mb-2">404</h1>
        <h2 class="text-lg font-semibold text-slate-200 mb-4">Page Not Found</h2>
        <p class="text-xs sm:text-sm text-slate-400 mb-8 leading-relaxed">
            The page you are looking for might have been moved or doesn't exist.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full py-3 px-6 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-semibold shadow-lg shadow-sky-500/25 hover:opacity-95 transition text-sm">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Return to Home</span>
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
